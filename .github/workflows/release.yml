name: Release

on:
  push:
    tags:
      - 'v*-personal.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          npm run build

      - name: Prepare release package
        run: |
          mkdir -p release/sona/assets
          cp dist/index.js dist/index.css LICENSE release/sona/
          cp -R assets/. release/sona/assets/
          if [ -d dist/assets ]; then cp -R dist/assets/. release/sona/assets/; fi
          cp README_个人版.md release/sona/README.md
          (cd release && zip -r "../sona-$RELEASE_TAG.zip" sona/)
          sha256sum "sona-$RELEASE_TAG.zip" > SHA256SUMS.txt

      - name: Generate release notes
        run: |
          awk -v heading="## [${RELEASE_TAG#v}]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sona 个人战绩增强版 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            sona-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
