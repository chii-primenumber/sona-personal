name: Release

on:
  push:
    tags:
      - 'v*-personal.*'

permissions:
  contents: write

jobs:
  test-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated installation and rollback
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File qa-local/verify-installer.ps1

  build-and-release:
    needs: test-installer
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          npm run build

      - name: Prepare release package
        run: |
          curl --fail --location --retry 2 https://github.com/PenguLoader/PenguLoader/releases/download/v1.1.6/pengu-loader-v1.1.6.zip --output pengu.zip
          python scripts/package-release.py --pengu-zip pengu.zip --output release

      - name: Generate release notes
        run: |
          awk -v heading="## [${RELEASE_TAG#v}]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          cat installer/RELEASE_GUIDE.md >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sona 个人战绩增强版 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/sona-${{ github.ref_name }}-one-click-windows.zip
            release/sona-${{ github.ref_name }}.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
